<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Задание 3 — Обнуление Cookies</title>
    <!-- Передача cookies с просроченной датой (1 января 1970 г.) для их удаления браузером -->
    <META HTTP-EQUIV="Set-Cookie" CONTENT="visitor=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/">
    <META HTTP-EQUIV="Set-Cookie" CONTENT="level=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/">
    <script>
        // Резервное удаление cookies через JavaScript для современных браузеров
        document.cookie = 'visitor=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
        document.cookie = 'level=; expires=Thu, 01 Jan 1970 00:00:00 GMT; path=/';
    </script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 720px; margin: 40px auto; padding: 0 16px; line-height: 1.6; }
        .msg { padding: 16px; border-radius: 8px; background: #fef3c7; border-left: 4px solid #d97706; margin: 16px 0; }
    </style>
</head>
<body>
    <h1>Задание 3: Обнуление Cookies</h1>
    <div class="msg">
        Команда на удаление cookies (<code>visitor</code> и <code>level</code>) отправлена с просроченной датой <code>Thu, 01 Jan 1970 00:00:00 GMT</code>.
    </div>
    <p>Cookies, пришедшие с этим запросом (до удаления):
        <!-- SSI-команда #echo выводит cookies, присутствовавшие в запросе -->
        <code><!--#echo var="HTTP_COOKIE" --></code>
    </p>
    <p>
        <a href="task1_visit.shtml">Проверить Задание 1</a> |
        <a href="task2_profile.shtml">Проверить Задание 2</a> |
        <a href="index.shtml">На главную</a>
    </p>
</body>
</html>
